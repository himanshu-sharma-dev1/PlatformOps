---
- name: Deploy or remove a Docker service card
  hosts: all
  gather_facts: false
  # The API runs local targets through Docker-in-Docker.  Ansible's local
  # connection already executes as the API user (root in the runtime image),
  # and the image intentionally does not contain sudo.  Keep privilege
  # escalation for SSH targets while making the local path usable.
  become: "{{ (ansible_connection | default('ssh')) != 'local' }}"
  vars:
    remove: false
    contract: {}
  tasks:
    - name: Ensure Docker network exists
      community.docker.docker_network:
        name: "{{ docker_network }}"
        state: present
      when: not remove

    - name: Ensure host volume directories exist
      ansible.builtin.file:
        path: "{{ item.split(':')[0] }}"
        state: directory
        mode: "0755"
      loop: "{{ contract.volumes | default([]) }}"
      when:
        - not remove
        - item.split(':')[0] | basename | regex_search('\\.') is none

    - name: Ensure mounted config file parent directories exist
      ansible.builtin.file:
        path: "{{ item.split(':')[0] | dirname }}"
        state: directory
        mode: "0755"
      loop: "{{ contract.volumes | default([]) }}"
      when:
        - not remove
        - item.split(':')[0] | basename | regex_search('\\.') is not none

    - name: Create placeholder config files when a file mount is expected
      ansible.builtin.copy:
        dest: "{{ item.split(':')[0] }}"
        content: "# Managed by PlatformOps. Replace with service-specific config.\n"
        force: false
        mode: "0644"
      loop: "{{ contract.volumes | default([]) }}"
      when:
        - not remove
        - item.split(':')[0] | basename | regex_search('\\.') is not none

    - name: Prepare Redis data and log paths in the Docker engine namespace
      community.docker.docker_container:
        name: "{{ container_name }}-permissions"
        image: "{{ image }}"
        state: started
        entrypoint: ["/bin/sh", "-c"]
        command:
          - >-
            set -eu;
            uid=$(id -u redis 2>/dev/null || echo 999);
            gid=$(id -g redis 2>/dev/null || echo 1000);
            mkdir -p /data /var/log/redis;
            touch /var/log/redis/redis.log;
            chown -R "${uid}:${gid}" /data /var/log/redis;
            chmod 0755 /data /var/log/redis;
            chmod 0644 /var/log/redis/redis.log
        user: "0:0"
        volumes: "{{ contract.volumes | default([]) }}"
        detach: false
        cleanup: true
        output_logs: true
      when:
        - not remove
        - service_key | default('') == 'redis-core'

    - name: Remove service container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent
      when: remove

    - name: Run service container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image }}"
        state: started
        restart_policy: unless-stopped
        networks:
          - name: "{{ docker_network }}"
        published_ports: "{{ contract.ports | default([]) }}"
        volumes: "{{ contract.volumes | default([]) }}"
        env: "{{ contract.environment | default({}) }}"
        command: "{{ contract.command | default(omit) }}"
        healthcheck: >-
          {{
            {
              'test': ['CMD-SHELL', contract.healthcheck.command],
              'interval': contract.healthcheck.interval | default('2s'),
              'timeout': contract.healthcheck.timeout | default('3s'),
              'retries': contract.healthcheck.retries | default(5),
              'start_period': contract.healthcheck.start_period | default('0s')
            }
            if contract.healthcheck is defined and contract.healthcheck.command is defined
            else omit
          }}
      when: not remove

    - name: Show deployed service
      ansible.builtin.debug:
        msg: "{{ service_name }} is managed as {{ container_name }}"
      when: not remove

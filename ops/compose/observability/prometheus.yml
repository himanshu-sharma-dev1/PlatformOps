global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'redis_exporter'
    static_configs:
      - targets: ['docker-engine:9121']
        labels:
          service_id: '__OBS_SERVICE_ID__'
          container_name: '__OBS_CONTAINER_NAME__'
          run_id: '__OBS_RUN_ID__'

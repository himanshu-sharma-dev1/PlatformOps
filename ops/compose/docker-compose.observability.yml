name: ${PLATFORMOPS_OBS_PROJECT:?set PLATFORMOPS_OBS_PROJECT to a unique disposable name}

# Supporting evidence infrastructure only. It is not a cPlatform parity target.
# The sole external network is the disposable platformops-isolated project; no
# host Docker socket, cPlatform network, fixed IP, or host port is used.
services:
  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      obs_private:
        aliases: [observability-support-loki]
      isolated_runtime:
        aliases: [observability-loki]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready | grep -q ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  alloy:
    image: grafana/alloy:v1.5.1
    command: ["run", "/etc/alloy/config.alloy", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy"]
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy
    networks:
      obs_private:
      isolated_runtime:
        aliases: [observability-alloy]
    depends_on:
      loki:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.52.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ${PLATFORMOPS_OBS_PROM_CONFIG:?generated config path required}:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      obs_private:
      isolated_runtime:
        aliases: [observability-prometheus]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready | grep -q 'Prometheus Server is Ready'"]
      interval: 5s
      timeout: 3s
      retries: 30

  glitchtip-db:
    profiles: ["glitchtip"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${PLATFORMOPS_OBS_DB_PASSWORD:?generated database password required}
    volumes:
      - glitchtip_db_data:/var/lib/postgresql/data
    networks: [obs_private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 5s
      timeout: 3s
      retries: 30

  glitchtip-valkey:
    profiles: ["glitchtip"]
    image: valkey/valkey:7.2-alpine
    command: ["valkey-server", "--save", "60", "1000", "--appendonly", "yes"]
    volumes:
      - glitchtip_valkey_data:/data
    networks: [obs_private]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  glitchtip-migrate:
    profiles: ["glitchtip"]
    image: iktaraai/services:glitchtip-iktara-6.1.9
    environment: &glitchtip_environment
      DATABASE_URL: postgresql://glitchtip:${PLATFORMOPS_OBS_DB_PASSWORD}@glitchtip-db:5432/glitchtip
      REDIS_URL: redis://glitchtip-valkey:6379/0
      SECRET_KEY: ${PLATFORMOPS_OBS_SECRET_KEY:?generated GlitchTip secret required}
      GLITCHTIP_DOMAIN: http://observability-glitchtip:8000
      ENABLE_OPEN_USER_REGISTRATION: "False"
      PORT: "8000"
      EMAIL_URL: consolemail://
    command: ["./manage.py", "migrate", "--noinput"]
    networks: [obs_private]
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-valkey:
        condition: service_healthy
    restart: "no"

  glitchtip-bootstrap:
    profiles: ["glitchtip"]
    image: iktaraai/services:glitchtip-iktara-6.1.9
    environment:
      <<: *glitchtip_environment
      DJANGO_SUPERUSER_EMAIL: ${PLATFORMOPS_OBS_ADMIN_EMAIL:?disposable admin email required}
      DJANGO_SUPERUSER_PASSWORD: ${PLATFORMOPS_OBS_ADMIN_PASSWORD:?generated admin password required}
    command:
      - sh
      - -c
      - >-
        ./manage.py createsuperuser --noinput --email "$${DJANGO_SUPERUSER_EMAIL}" ||
        ./manage.py shell -c 'import os; from django.contrib.auth import get_user_model;
        assert get_user_model().objects.filter(email=os.environ["DJANGO_SUPERUSER_EMAIL"]).exists()'
    networks: [obs_private]
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
    restart: "no"

  glitchtip:
    profiles: ["glitchtip"]
    image: iktaraai/services:glitchtip-iktara-6.1.9
    environment: *glitchtip_environment
    networks:
      obs_private:
      isolated_runtime:
        aliases: [observability-glitchtip, glitchtip]
    depends_on:
      glitchtip-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/_health/\", timeout=3)' || python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/\", timeout=3)'"]
      interval: 10s
      timeout: 5s
      retries: 30

  glitchtip-worker:
    profiles: ["glitchtip"]
    image: iktaraai/services:glitchtip-iktara-6.1.9
    environment:
      <<: *glitchtip_environment
      SERVER_ROLE: worker
    networks: [obs_private]
    depends_on:
      glitchtip-bootstrap:
        condition: service_completed_successfully

networks:
  obs_private:
    internal: true
  isolated_runtime:
    external: true
    name: ${PLATFORMOPS_ISOLATED_NETWORK:-platformops-isolated_default}

volumes:
  loki_data:
  alloy_data:
  prometheus_data:
  glitchtip_db_data:
  glitchtip_valkey_data:

---
- name: Get Service Container Status
  hosts: all
  become: yes
  gather_facts: false
  tasks:

    - name: Copy the service status script to the target machine
      ansible.builtin.copy:
        src: "{{ script_src }}"
        dest: /tmp/service_status.py
        mode: '0755'

    - name: Execute the script and capture output
      ansible.builtin.command:
        argv:
          - python3
          - /tmp/service_status.py
          - --container-name
          - "{{ container_name }}"
          - --main-port
          - "{{ main_port }}"
          - --dependency-role
          - "{{ dependency_role }}"
          - --target-port
          - "{{ target_port }}"
          - --dependencies-b64
          - "{{ dependencies_b64 }}"
      register: script_output
      changed_when: false

    - name: Print the results
      debug:
        msg: >
          'Python script output': '{{ script_output.stdout }}'

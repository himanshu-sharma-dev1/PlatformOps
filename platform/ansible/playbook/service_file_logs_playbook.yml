---
- name: Fetch service file logs from target node
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Copy file log script to target host
      ansible.builtin.copy:
        src: "{{ script_src }}"
        dest: /tmp/service_file_logs.py
        mode: '0755'

    - name: Execute file log script
      ansible.builtin.command:
        argv:
          - python3
          - /tmp/service_file_logs.py
          - --log_paths_b64
          - "{{ log_paths_b64 }}"
          - --tail_lines
          - "{{ tail_lines | default('250') }}"
          - --file_stream
          - "{{ file_stream | default('all') }}"
      register: file_logs_output
      changed_when: false
      failed_when: false

    - name: Print file logs payload
      ansible.builtin.debug:
        msg: >-
          'payload_b64': '{{ file_logs_output.stdout | b64encode }}'

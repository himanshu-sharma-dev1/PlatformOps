---
- name: Deploy node Alloy for cPlatform diagnostics
  hosts: all
  gather_facts: false
  become: yes
  tasks:
    - name: Ensure node observability directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ observability_root }}"
        - "{{ observability_compose_dir }}"

    - name: Render node Alloy config
      ansible.builtin.copy:
        content: "{{ alloy_config_b64 | b64decode }}"
        dest: "{{ observability_compose_dir }}/config.alloy"
        mode: '0644'
      register: alloy_config

    - name: Render node Alloy compose file
      ansible.builtin.template:
        src: ../templates/observability/node-alloy-compose.yml.j2
        dest: "{{ observability_compose_dir }}/docker-compose.yml"
        mode: '0644'
      register: alloy_compose

    - name: Start or update node Alloy
      ansible.builtin.command:
        cmd: docker compose up -d alloy
        chdir: "{{ observability_compose_dir }}"

    - name: Restart node Alloy when config changes
      ansible.builtin.command:
        cmd: docker compose restart alloy
        chdir: "{{ observability_compose_dir }}"
      when: alloy_config.changed or alloy_compose.changed

    - name: Wait for node Alloy health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ alloy_host_port }}/-/ready"
        method: GET
        status_code: 200
      register: alloy_health
      retries: 15
      delay: 2
      until: alloy_health.status == 200

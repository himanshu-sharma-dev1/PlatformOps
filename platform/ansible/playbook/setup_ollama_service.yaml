- name: Set default Ollama models if not defined
  set_fact:
    ollama_models: "{{ ollama_models | default(['llama3.1', 'znbang/bge:small-en-v1.5-q8_0']) }}"

- name: Set Ollama install script SHA256
  set_fact:
    ollama_install_script_sha256: "25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f"

- name: Install required dependencies
  apt:
    name:
      - curl
      - fuse
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Download Ollama install script securely
  get_url:
    url: https://ollama.com/install.sh
    dest: /tmp/ollama_install.sh
    mode: 0755
    checksum: "sha256:{{ ollama_install_script_sha256 }}"
  register: download_result
  retries: 3
  delay: 20
  until: download_result is succeeded

- name: Remove stale Ollama library directory before install
  file:
    path: /usr/local/lib/ollama
    state: absent

- name: Install Ollama securely
  command: /tmp/ollama_install.sh
  args:
    creates: /usr/bin/ollama

- name: Create systemd service configuration
  template:
    src: ../templates/ollama.service.j2
    dest: /etc/systemd/system/ollama.service
    mode: 0644

- name: Reload systemd
  systemd:
    daemon_reload: yes

- name: Ensure Ollama service is running
  systemd:
    name: ollama
    state: started
    enabled: yes

- name: Check currently installed models
  uri:
    url: http://localhost:11434/api/tags
    method: GET
    return_content: yes
  register: model_check
  retries: 5
  delay: 5
  until: model_check.status == 200

- name: Install missing models
  shell: ollama pull {{ item }}
  loop: "{{ ollama_models }}"
  when: >
    item not in (model_check.content | from_json).models | map(attribute='name') | list
  retries: 2
  delay: 30
  register: model_pulls
  failed_when: model_pulls.rc != 0

- name: Restart Ollama service to apply changes
  systemd:
    name: ollama
    state: restarted
    enabled: yes

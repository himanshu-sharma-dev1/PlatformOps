worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    # Set the maximum allowed file size to 5MB
    client_max_body_size 200M;

    # Redirect HTTP to HTTPS and enable HSTS
    server {
        listen 80;
        server_name iktaratech.com;
        return 301 https://$host$request_uri;
    }

    # HTTPS server block
    server {
        listen 443 ssl http2;
        server_name iktaratech.com;

        # SSL certificate and key

    	ssl_certificate /etc/nginx/ssl/certificate.crt;
    	ssl_certificate_key /etc/nginx/ssl/private.key;

        # Enforce SSL/TLS configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";

        # Enable OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/nginx/ssl/certificate.crt;

        # Proxy settings for your web application
        location / {
            proxy_pass http://localhost:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_redirect off;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 86400;
        }

        # Normalize to trailing slash for consistent subpath routing.
        location = /glitchtip {
            return 301 /glitchtip/;
        }

        # Same-origin GlitchTip proxy so iframe works on HTTPS without mixed content.
        # GlitchTip serves at "/" by default, so rewrite base href + redirects for subpath use.
        location /glitchtip/static/ {
            proxy_pass http://180.75.0.49:8000/static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /glitchtip;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            expires off;
        }

        # GlitchTip built bundles may request /favicon.png at root.
        # Pin it to the branded asset under the proxied static path.
        location = /glitchtip/favicon.png {
            return 302 /glitchtip/static/assets/images/iktara-favicon.png;
        }

        location = /glitchtip/favicon.ico {
            return 302 /glitchtip/static/assets/images/iktara-favicon.png;
        }

        location /glitchtip/ {
            proxy_pass http://180.75.0.49:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /glitchtip;
            proxy_set_header Accept-Encoding "";
            proxy_redirect ~^/(.*)$ /glitchtip/$1;
            sub_filter_types text/css application/javascript application/json text/javascript;
            sub_filter_once on;
            sub_filter 'base href="/"' 'base href="/glitchtip/"';
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # Loki reverse proxy endpoint for diagnostics ingestion/query via nginx
        #location /loki/ {
        #    proxy_pass http://loki:3100/;
        #    proxy_set_header Host $host;
        #    proxy_set_header X-Real-IP $remote_addr;
        #    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #    proxy_redirect off;
        #    proxy_http_version 1.1;
        #    proxy_read_timeout 86400;
        #}



        # Serve static files with caching and compression
        location /static/ {
            alias /iktara/cPlatform/cPlatform/staticfiles/;
            autoindex on;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            expires off;
            gzip on;
            gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
            gzip_min_length 1000;
            gzip_proxied any;
            gzip_vary on;
        }

    }

}

services:
  postgres:
    image: postgres:16-alpine
    container_name: platformops_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    volumes:
      - platformops_postgres_data:/var/lib/postgresql/data
    networks:
      - platformops_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: platformops_redis
    restart: always
    networks:
      - platformops_network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: platformops_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    networks:
      - platformops_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: platformops_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - platformops_network

  loki:
    image: grafana/loki:3.2.1
    container_name: platformops_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./config/observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - platformops_loki_data:/loki
    networks:
      - platformops_network

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: platformops_alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./config/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - platformops_alloy_data:/var/lib/alloy/data
    networks:
      - platformops_network
    depends_on:
      - loki

  # GlitchTip Error Tracking Stack
  glitchtip_postgres:
    image: postgres:16-alpine
    container_name: platformops_glitchtip_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtippassword
      POSTGRES_DB: glitchtip
    volumes:
      - platformops_glitchtip_db_data:/var/lib/postgresql/data
    networks:
      - platformops_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip"]
      interval: 5s
      timeout: 5s
      retries: 5

  glitchtip_valkey:
    image: valkey/valkey:8.0-alpine
    container_name: platformops_glitchtip_valkey
    restart: unless-stopped
    volumes:
      - platformops_glitchtip_valkey_data:/data
    networks:
      - platformops_network

  glitchtip_web:
    image: iktaraai/services:glitchtip-iktara-6.1.9
    container_name: platformops_glitchtip_web
    restart: unless-stopped
    ports:
      - "8008:8000"
    env_file:
      - config/observability/glitchtip.env
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtippassword@glitchtip_postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip_valkey:6379/0
      PORT: 8000
    depends_on:
      glitchtip_postgres:
        condition: service_healthy
      glitchtip_valkey:
        condition: service_started
    networks:
      - platformops_network

  glitchtip_worker:
    image: iktaraai/services:glitchtip-iktara-6.1.9
    container_name: platformops_glitchtip_worker
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    env_file:
      - config/observability/glitchtip.env
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtippassword@glitchtip_postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip_valkey:6379/0
    depends_on:
      glitchtip_postgres:
        condition: service_healthy
      glitchtip_valkey:
        condition: service_started
    networks:
      - platformops_network

  # Core PlatformOps Web Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: platformops/web:1.0.0
    container_name: platformops_web
    restart: always
    ports:
      - "9020:8000"
    environment:
      PYTHONPATH: /app:/app/apps:/app/apps/platformops:/app/apps/platformops/lib
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_ENV_FILE: /app/config/local.env
      DIAGNOSTICS_ENV_FILE: /app/config/diagnostics.env
      EMAIL_HOST: platformops_mailpit
      EMAIL_PORT: 1025
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - platformops_network

networks:
  platformops_network:
    name: platformops_network
    driver: bridge

volumes:
  platformops_postgres_data:
  platformops_loki_data:
  platformops_alloy_data:
  platformops_glitchtip_db_data:
  platformops_glitchtip_valkey_data:

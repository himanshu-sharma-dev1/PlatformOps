<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bootstrap Navbar Page</title>
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f8f9fa;
    }

    .navbar {
      background: linear-gradient(45deg, #0d6efd, #6610f2);
    }

    .navbar-brand, .nav-link {
      color: #fff !important;
    }

    .nav-link:hover {
      text-decoration: underline;
    }

    .container-content {
      margin-top: 50px;
      text-align: center;
    }

    h1 {
      font-weight: 600;
      color: #343a40;
    }

    p {
      font-size: 1.1rem;
      color: #6c757d;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg shadow">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">DForm</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
        data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/dForm/Static">Rows</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/dForm/StaticAccordion">Accordion</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/dForm/MapFields">MapField</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/dForm/ApiTest">ApiTest</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/dForm/Tabs">Tabs</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.3/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>

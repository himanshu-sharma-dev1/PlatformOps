<!DOCTYPE html>
<html lang="en">
{% include "Index.html" %}
{% block content %}
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Page Title</title>

  <!-- Optional: Link to a CSS file -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

  {% load static %}
  <link rel="stylesheet" type="text/css" href="{% static 'DFormTest.css' %}">
  <script type="module" src="{% static 'DForm.js' %}"></script>
</head>
<body>


  <div class="row ik-nav-button mt-5">
    <div class="col-lg-1 text-center">
        <button type="button" class="btn ik-btn px-2 m-0" data-bs-toggle="modal" data-bs-tooltip="tooltip"
            title="Add Template" data-bs-target="#addModal" onclick="addReport(event)">
            <span class="fs-4 bi bi-plus-square-fill text-dark"></span>
        </button>
    </div>
    <div class="col-lg-1"></div> <!-- This was wrongly placed outside the .row -->
  </div>


  <div class="row">
  <!-- Modal -->
      <div class="modal fade" id="addModal" data-bs-backdrop="static" data-bs-keyboard="true" tabindex="-1"
           aria-labelledby="addModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-xl">
                  <div class="modal-content">

                      <!-- Modal Header -->
                        <div class="modal-header p-0 pt-1 pb-1 ik-modalHeader">
                          <h6 class="modal-title ik-modalTitle text-center" id="addModalLabel">Add New Model</h6>
                        </div>

                      <!-- Modal Body -->
                        <div class="modal-body ik-modalBody">
                              <form method="post" enctype="multipart/form-data" action="">
                                  {% csrf_token %}

                                  <div class="form-group px-3"></div>

                                  <!-- Modal Footer -->
                                  <div class="modal-footer ik-modalFooter">
                                    <input type="hidden" name="json_data" id="json_data">
                                    <button type="button" class="btn ik-close-btn px-2 py-1" data-bs-dismiss="modal">Close</button>
                                    <button type="button" value="add" name="user-action" class="btn ik-add-btn px-2 py-1" onclick="createJson(event)">Add</button>
                                  </div>
                              </form>
                        </div>
                  </div>
            </div>
        </div>
  </div>

<script>
let schema = {{ field_schema | safe }}

async function getData(oem) {
    let form_data = new FormData();
    form_data.append('oem', oem);

    let response = await fetch('/dForm/getParamList', {
        method: 'POST',
        body: form_data
    });

    if (response.ok) {
        let data = await response.json();
        return data
    } else {
        console.error('HTTP Error:', response.status);
    }
}


function addReport(event) {
    const button = event.currentTarget;
    const modalId = button.getAttribute('data-bs-target');
    window.forms.dFormCreate(schema, modalId, null);
}


async function selectOem(event){
    let list = await getData(event.target.value);
    let field =  event.target.parentNode.nextElementSibling.querySelector('select')
    window.forms.dFormSetOptions(field, list)
}


</script>

</body>
{% endblock %}
</html>

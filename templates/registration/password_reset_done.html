<!DOCTYPE html>
<html lang="en">
<head>
      <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">

    {% load static %}
     <link rel="stylesheet" type="text/css" href="{% static 'cRetailStyles_v02.css' %}">

    <link rel="shortcut icon" type="image/png" href="{% static 'favicon-airtel.png' %}"/>
    <style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffffff 0%, #ffffff 48%, #e60000 48%, #ff1a1a 100%);
  }
  .page {
    width: min(1100px, 92vw);
    min-height: 640px;
    display: grid;
    grid-template-columns: 1.2fr 0.9fr;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 28px;
    overflow: hidden;
    backdrop-filter: blur(8px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.18);
  }
  .left {
    padding: 56px;
    color: #111;
    position: relative;
    background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,255,255,0.92));
  }
  .brand {
    position: absolute;
    top: 28px;
    left: 36px;
    font-weight: 800;
    color: #e60000;
    font-size: 28px;
    letter-spacing: 0.5px;
  }
  .content {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
  }
  h1 { font-size: clamp(38px, 5vw, 62px); line-height: 1.05; color: #111; }
  p { font-size: 18px; color: #444; max-width: 520px; line-height: 1.6; }
  .shape {
    position: absolute;
    right: 30px;
    top: 200px;
    width: 160px;
    height: 160px;
    border: 18px solid rgba(230,0,0,0.15);
    border-radius: 50%;
  }
  .shape2 {
    position: absolute;
    right: 90px;
    top: 110px;
    width: 160px;
    height: 160px;
    border: 18px solid rgba(230,0,0,0.15);
    border-radius: 50%;
  }
  .right {
    padding: 56px 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #ff1a1a 0%, #e60000 100%);
    color: white;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 24px;
    padding: 34px 30px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.15);
  }
  .card h2 { font-size: 34px; margin-bottom: 8px; }
  .card p { color: rgba(255,255,255,0.88); margin-bottom: 24px; font-size: 15px; }
  .field { margin-bottom: 16px; }
  .field input {
    width: 100%;
    height: 52px;
    border: none;
    outline: none;
    border-radius: 12px;
    padding: 0 16px;
    font-size: 15px;
    background: rgba(255,255,255,0.95);
    color: #111;
  }
  .btn {
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 12px;
    background: #111;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn:hover { background: #000; }
  .links {
    display: flex;
    justify-content: space-between;
    margin-top: 16px;
    font-size: 14px;
  }
  .links a { color: white; text-decoration: none; opacity: 0.92; }
  @media (max-width: 900px) {
    body { padding: 18px; }
    .page { grid-template-columns: 1fr; min-height: auto; }
    .left { min-height: 340px; }
  }
</style>
</head>
{% block content %}
<body style="overflow:hidden;">
 <div class="page">
    <section class="left">
       {% load static %}
       <img src="{% static 'airtelTaw/airtel_img2.png' %}" alt="airtel_img">
      <div class="shape"></div>
      <div class="shape2"></div>
      <div class="content">
         <div class="text-center">

            <div class="Jam-heading">Reset password</div>
            <p class="datajam-light">We've emailed you instructions for Resetting password.<br>
                                     Please make sure you've entered the address you registered with.</p>

        </div>
      </div>
    </section>
    <section class="right">
      <div class="card text-center">
        <form method="post" class="form-group">
        <h2>Welcome</h2>

        </form>
      </div>
    </section>
  </div>

</body>
{% endblock %}
</html>

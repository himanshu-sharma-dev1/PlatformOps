<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>DataJam</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">

    {% load static %}
     <link rel="stylesheet" type="text/css" href="{% static 'cRetailStyles_v02.css' %}">

    <link rel="shortcut icon" type="image/png" href="{% static 'favicon-airtel.png' %}"/>
    <style>
        a:hover{
            color:black;
        }
        a{
            background-color:#e40000;
            color:#fff;
            border:1px solid #E94B52;
            border-radius:4px;
            text-decoration:none;
        }
    </style>
</head>
{% block content %}
<body style="overflow:hidden;">
    <div class="main-div">
        <div class="row">
             <div class="col-12 col-lg-12" style="height:100vh;">
                <img src="{% static 'airtelTaw/bg06.jpg' %}" alt="bg06" class="w-100 h-100">
            </div>
            <div class="col-12 col-lg-6 mt-5" style="display:flex; justify-content:center; align-items:center; position:absolute;">
                <div class="text-center">
                      <img src= "{% static 'airtelTaw/airtel_img2.png' %}" alt="airtel_img" width="200" height="80">
                    <div>
                        <div class="Jam-heading">Password Reset</div>
                        <p class="text-danger">Your password has been changed.</p>
                        <a href="/" class="px-2 py-1">Login Now</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
{% endblock %}
</html>

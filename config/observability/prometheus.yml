global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"

  - job_name: "node-exporter"
    static_configs:
      - targets: ["platformops_node_exporter:9100"]
        labels:
          service: "node-exporter"

  - job_name: "process-exporter"
    static_configs:
      - targets: ["platformops_process_exporter:9256"]
        labels:
          service: "process-exporter"

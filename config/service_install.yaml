        Observability:
          container_history:
            enabled: true
          file_logs:
            enabled: true
            paths:
            - /{{ machine_volume }}/iktara/prometheusRAGLogs
            loki_labels:
              service_name: Prometheus
              service_type: Prometheus
              source_type: file

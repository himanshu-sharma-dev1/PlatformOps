services:
  TrainingServer:
    HW_Info:
      CPUs: 2
      GPUs: 0
      RAM_GB: 4
      Storage_GB: 10
    SW_Info:
      OS Type: Linux
      Distribution Name: Ubuntu
      Distribution Version: '22.04'
      Docker Installed: 'Yes'
      NVIDIA Container Toolkit Installed: 'No'
    Docker_Info:
      RabbitMQ:
        Image_Name: iktaraai/services:rabbitmq
        Image_Ver: 1.0.0
        Int_IP_Addr: 180.75.0.2
        Int_Port: 5672
        Environment:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin
        Volumes:
        - /{{ machine_volume }}/iktara/rabbitmqLogs:/var/log/rabbitmq
        - /{{ machine_volume }}/iktara/rabbitmqConfig/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
        Config_Files:
        - src: ../../docker/rabbitmq/rabbitmq.conf
          dest: /{{ machine_volume }}/iktara/rabbitmqConfig/rabbitmq.conf
          mode: '0644'
        Observability:
          container_history:
            enabled: true
          file_logs:
            enabled: true
            paths:
            - /{{ machine_volume }}/iktara/rabbitmqLogs
            loki_labels:
              service_name: RabbitMQ
              service_type: RabbitMQ
              source_type: file
      TrainingServer:
        Image_Name: iktaraai/services:dTrain
        Image_Ver_List:
        - 1.0.0
        - 2.0.0
        Int_IP_Addr: 180.75.0.12
        Int_Port: 8000
        Volumes:
        - /{{ service_volume }}/iktara/trainingServer/logs:/iktara/dTrain/dTrain/logs
        - /{{ machine_volume }}/iktara/Repository:/iktara/Repository
        Role: Primary
        env:
          DJANGO_ENV_FILE: /iktara/{{ service }}/platform/docker/{{ service }}/deployment.env
        Observability:
          container_history:
            enabled: true
          file_logs:
            enabled: true
            paths:
            - /{{ service_volume }}/iktara/trainingServer/logs
            loki_labels:
              service_name: dTrain
              service_type: TrainingServer
              source_type: file
          service_events:
            enabled: true
          live_logs:
            enabled: true
  ANS:
    HW_Info:
      CPUs: 2
      GPUs: 0
      RAM_GB: 4
      Storage_GB: 10
    SW_Info:
      OS Type: Linux
      Distribution Name: Ubuntu
      Distribution Version: '22.04'
      Docker Installed: 'Yes'
      NVIDIA Container Toolkit Installed: 'No'
    Docker_Info:
      ANS:
        Image_Name: iktaraai/services:ANS
        Image_Ver_List:
        - 1.0.0
        - 2.0.0
        Command: bash entrypoint_script.sh
        Int_IP_Addr: 180.75.0.11
        Int_Port: 8000
        Volumes:
        - /{{ machine_volume }}/iktara/Repository:/iktara/Repository
        - /{{ service_volume }}/iktara/ans/logs:/iktara/airtel_taw/cTAW/logs
        Role: Primary
        env:
          DJANGO_ENV_FILE: /iktara/{{ service }}/platform/docker/{{ service }}/deployment.env
        memory: 8g
        memory_swap: 8g
        Observability:
          container_history:
            enabled: true
          file_logs:
            enabled: true
            paths:
            - /{{ service_volume }}/iktara/ans/logs
            loki_labels:
              service_name: ANS
              service_type: ANS
              source_type: file
          service_events:
            enabled: true
          live_logs:
            enabled: true
      node-exporter:
        Image_Name: iktaraai/services:node-exporter
        Image_Ver: 1.0.0
        Int_IP_Addr: 180.75.0.7
        Int_Port: 9100
        Volumes:
        - /{{ machine_volume }}/iktara/nodeExporterLogs:/var/log/node-exporter
        Observability:
          container_history:
            enabled: true
          file_logs:
            enabled: true
            paths:
            - /{{ machine_volume }}/iktara/nodeExporterLogs
            loki_labels:
              service_name: node-exporter
              service_type: node-exporter
              source_type: file
      process-exporter:
        Image_Name: iktaraai/services:process-exporter
        Image_Ver: 1.0.0
        Int_IP_Addr: 180.75.0.62
        Int_Port: 9256
        Network_Name: cplatform_iktara_cPlatform
        Network_Subnet: 180.75.0.0/24
        Default_Expose_Service: true
        Default_Host_Port: 9014
        Privileged: true
        Volumes:
        - /proc:/host/proc:ro
        - /{{ machine_volume }}/iktara/processExporterLogs:/var/log/process-exporter
        - /{{ machine_volume }}/iktara/processExporterConfig/process-exporter.yml:/etc/process-exporter/process-exporter.yml:ro
        Config_Files:
        - src: ../../docker/process-exporter/process-exporter.yml
          dest: /{{ machine_volume }}/iktara/processExporterConfig/process-exporter.yml
          mode: '0644'
        Observability:
          container_history:
            enabled: true
          file_logs:
            enabled: true
            paths:
            - /{{ machine_volume }}/iktara/processExporterLogs
            loki_labels:
              service_name: process-exporter
              service_type: process-exporter
              source_type: file
      kafka-exporter:
        Image_Name: danielqsj/kafka-exporter:v1.8.0
        Image_Ver: v1.8.0
        Image_Tag_Includes_Version: true
        Pull_Image: true
        Int_IP_Addr: 180.75.0.63
        Int_Port: 9308
        Network_Name: cplatform_iktara_cPlatform
        Network_Subnet: 180.75.0.0/24
        Default_Expose_Service: true
        Default_Host_Port: 9014
        Network_Aliases:
        - kafka-exporter
        Environment:
          KAFKA_SERVER: 180.75.0.31:9092
        Volumes:
        - /{{ machine_volume }}/iktara/kafkaExporterLogs:/var/log/kafka-exporter
        Observability:
          container_history:
            enabled: true
          file_logs:
            enabled: true
            paths:
            - /{{ machine_volume }}/iktara/kafkaExporterLogs
            loki_labels:
              service_name: kafka-exporter
              service_type: kafka-exporter
              source_type: file
      dcgmExporter:
        Image_Name: iktaraai/services:dcgmExporter
        Image_Ver: 1.0.0
        Int_IP_Addr: 180.75.0.14
        capabilities:
        - SYS_ADMIN
        Int_Port: 9400
        Volumes:
        - /{{ machine_volume }}/iktara/dcgmExporterLogs:/var/log/dcgm-exporter
        Observability:
          container_history:
            enabled: true
          file_logs:
            enabled: true
            paths:
            - /{{ machine_volume }}/iktara/dcgmExporterLogs
            loki_labels:
              service_name: dcgmExporter
              service_type: dcgmExporter
              source_type: file
      Prometheus:
        Image_Name: node-node1001-prometheus:committed
        Image_Ver: committed
        Image_Tag_Includes_Version: true
        Pull_Image: false
        Int_IP_Addr: 180.75.0.13
        Int_Port: 9090
        Network_Name: cplatform_iktara_cPlatform
        Network_Subnet: 180.75.0.0/24
        Default_Expose_Service: true
        Default_Host_Port: 9012
        Command: --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.retention.time=30d
        Volumes:
        - /{{ machine_volume }}/iktara/prometheusANSLogs:/var/log/prometheus
        - /{{ service_volume }}/iktara/prometheusANSConfig/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        Config_Files:
        - src: ../../docker/prometheus/noc_prometheus.yml
          dest: /{{ service_volume }}/iktara/prometheusANSConfig/prometheus.yml
          mode: '0644'
        Observability:
          container_history:
            enabled: true
          file_logs:
            enabled: true
            paths:
            - /{{ machine_volume }}/iktara/prometheusANSLogs
            loki_labels:
              service_name: Prometheus
              service_type: Prometheus
              source_type: file
      ClickHouse:
        Image_Name: iktaraai/services:clickhouse
        Image_Ver: 1.0.0
        Int_IP_Addr: 180.75.0.9
        Int_Port: 8123
        Volumes:
        - /{{ service_volume }}/iktara/clickHouseDB:/var/lib/clickhouse
        - /{{ service_volume }}/iktara/clickHouseLogs:/var/log/clickhouse-server
        Observability:
          container_history:
            enabled: true
          file_logs:
            enabled: true
            paths:
            - /{{ service_volume }}/iktara/clickHouseLogs
            loki_labels:
              service_name: ClickHouse
              service_type: ClickHouse
              source_type: file
      Kafka:
        Image_Name: bitnami/kafka:3.8.1
        Image_Ver: 3.8.1
        Image_Tag_Includes_Version: true
        Pull_Image: true
        Int_IP_Addr: 180.75.0.31
        Int_Port: 9092
        Network_Name: cplatform_iktara_cPlatform
        Network_Subnet: 180.75.0.0/24
        Default_Expose_Service: true
        Default_Host_Port: 9013
        Network_Aliases:
        - kafka
        Environment:
          KAFKA_CFG_NODE_ID: '1'
          KAFKA_CFG_PROCESS_ROLES: broker,controller
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@180.75.0.31:9093
          KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
          KAFKA_CFG_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092
          KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://180.75.0.31:9092
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
          KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'false'
          KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
          KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
          KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: '1'
          ALLOW_PLAINTEXT_LISTENER: 'yes'
        Kafka_Bin: /opt/bitnami/kafka/bin
        Topics:
        - Name: noc.alarm.raw.v1
          Partitions: 3
          Replication_Factor: 1
          Cleanup_Policy: delete
          Retention_MS: 86400000
          Value_Format: raw-row-json
          Required_Headers:
          - stream_id
          - cycle_id
          - row_index
          - content_type
          - source
          - source_file
        - Name: noc.alarm.normalized.v1
          Partitions: 3
          Replication_Factor: 1
          Cleanup_Policy: delete
          Retention_MS: 86400000
          Value_Format: normalized-alarm-json
        - Name: noc.incident.candidate.v1
          Partitions: 3
          Replication_Factor: 1
          Cleanup_Policy: delete
          Retention_MS: 86400000
          Value_Format: candidate-incident-json
        - Name: noc.alarm.dlq.v1
          Partitions: 3
          Replication_Factor: 1
          Cleanup_Policy: delete
          Retention_MS: 604800000
          Value_Format: dead-letter-json
        - Name: noc.alarm.events.v2
          Partitions: 3
          Replication_Factor: 1
          Cleanup_Policy: delete
          Retention_MS: 86400000
          Value_Format: canonical-event-envelope-v2-json
        Volumes:
        - /{{ service_volume }}/iktara/kafka:/bitnami/kafka
        Observability:
          container_history:
            enabled: true
          file_logs:
            enabled: true
            paths:
            - /{{ service_volume }}/iktara/kafka/logs
            loki_labels:
              service_name: Kafka
              service_type: Kafka
              source_type: file
      NiFi:
        Image_Name: node-node1001-nifi:committed
        Image_Ver: committed
        Image_Tag_Includes_Version: true
        Pull_Image: false
        Int_IP_Addr: 180.75.0.10
        Int_Port: 8883
        Network_Name: cplatform_iktara_cPlatform
        Network_Subnet: 180.75.0.0/24
        Default_Expose_Service: true
        Default_Host_Port: 9001
        Volumes:
        - /{{ service_volume }}/iktara/nifiLogs:/opt/nifi/nifi-current/logs
        - /{{ service_volume }}/iktara/nifi/templates:/opt/nifi/nifi-current/templates:ro
        - /{{ service_volume }}/iktara/nifi/input:/opt/nifi/data/incoming
        Bootstrap_Files:
        - src: ../../docker/Nifi/flows/noc_alarm_raw_v1.flow.json
          dest: /{{ service_volume }}/iktara/nifi/templates/noc_alarm_raw_v1.flow.json
          mode: '0644'
        - src: ../../docker/Nifi/scripts/bootstrap_noc_alarm_flow.py
          dest: /{{ service_volume }}/iktara/nifi/templates/bootstrap_noc_alarm_flow.py
          mode: '0755'
        - src: ../../docker/Nifi/flows/noc_alarm_http_to_agenticnoc_v1.flow.json
          dest: /{{ service_volume }}/iktara/nifi/templates/noc_alarm_http_to_agenticnoc_v1.flow.json
          mode: '0644'
        - src: ../../docker/Nifi/contracts/noc_alarm_mapped_v1.schema.json
          dest: /{{ service_volume }}/iktara/nifi/templates/contracts/noc_alarm_mapped_v1.schema.json
          mode: '0644'
        - src: ../../docker/Nifi/contracts/noc_alarm_mapped_v1.avsc
          dest: /{{ service_volume }}/iktara/nifi/templates/contracts/noc_alarm_mapped_v1.avsc
          mode: '0644'
        - src: ../../docker/Nifi/templates/noc_alarm_http_to_agenticnoc_v1.xml
          dest: /{{ service_volume }}/iktara/nifi/templates/noc_alarm_http_to_agenticnoc_v1.xml
          mode: '0644'
        - src: ../../docker/Nifi/scripts/bootstrap_noc_alarm_http_flow.py
          dest: /{{ service_volume }}/iktara/nifi/templates/bootstrap_noc_alarm_http_flow.py
          mode: '0755'
        Bootstrap_Enabled_By_Default: false
        Observability:
          container_history:
            enabled: true
          file_logs:
            enabled: true
            paths:
            - /{{ service_volume }}/iktara/nifiLogs
            loki_labels:
              service_name: NiFi
              service_type: NiFi
              source_type: file
      PostgreSQL:
        Image_Name: iktaraai/services:postgres
        Image_Ver: 1.0.0
        Int_IP_Addr: 180.75.0.5
        Int_Port: 5432
        Command: postgres -c logging_collector=on -c log_destination=stderr -c log_directory=/var/log/postgresql
          -c log_filename=postgresql-%Y-%m-%d_%H%M%S.log -c log_rotation_age=1d -c
          log_rotation_size=10MB -c log_truncate_on_rotation=on -c log_min_messages=info
          -c log_connections=on -c log_disconnections=on
        Environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        Volumes:
        - /{{ machine_volume }}/iktara/postgresDB:/var/lib/postgresql/data
        - /{{ machine_volume }}/iktara/postgresLogs:/var/log/postgresql
        Observability:
          container_history:
            enabled: true
          file_logs:
            enabled: true
            paths:
            - /{{ machine_volume }}/iktara/postgresLogs
            loki_labels:
              service_name: PostgreSQL
              service_type: PostgreSQL
              source_type: file
      RabbitMQ:
        Image_Name: iktaraai/services:rabbitmq
        Image_Ver: 1.0.0
        Int_IP_Addr: 180.75.0.2
        Int_Port: 5672
        Environment:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin
        Volumes:
        - /{{ machine_volume }}/iktara/rabbitmqLogs:/var/log/rabbitmq
        - /{{ machine_volume }}/iktara/rabbitmqConfig/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
        Config_Files:
        - src: ../../docker/rabbitmq/rabbitmq.conf
          dest: /{{ machine_volume }}/iktara/rabbitmqConfig/rabbitmq.conf
          mode: '0644'
        Observability:
          container_history:
            enabled: true
          file_logs:
            enabled: true
            paths:
            - /{{ machine_volume }}/iktara/rabbitmqLogs
            loki_labels:
              service_name: RabbitMQ
              service_type: RabbitMQ
              source_type: file
  AgenticNOC:
    HW_Info:
      CPUs: 2
      GPUs: 0
      RAM_GB: 4
      Storage_GB: 20
    SW_Info:
      OS Type: Linux
      Distribution Name: Ubuntu
      Distribution Version: '22.04'
      Docker Installed: 'Yes'
      NVIDIA Container Toolkit Installed: 'No'
    Docker_Info:
      AgenticNOC:
        Image_Name: agenticnoc:1.0.5
        Image_Ver_List:
        - 1.0.5
        Image_Ver: 1.0.5
        Image_Tag_Includes_Version: true
        Pull_Image: false
        Command: all
        Deployment_Mode: ORDINARY
        Config_Push_Required: true
        Config_Push_Path: /AgenticNOC/APIv1/UpdateService/
        Health_Check:
          Enabled: true
          Path: /health/ready
          Timeout_Sec: 300
          Interval_Sec: 5
          Status_Code:
          - 200
        Int_IP_Addr: 180.75.0.7
        Int_Port: 8000
        Network_Name: cplatform_iktara_cPlatform
        Network_Subnet: 180.75.0.0/24
        Default_Expose_Service: true
        Default_Host_Port: 9015
        Environment:
          DJANGO_SETTINGS_MODULE: agentic_noc.settings.local
          DJANGO_ALLOWED_HOSTS: '*'
          DATABASE_URL: postgresql://agenticnoc_app:${AGENTICNOC_DB_PASSWORD}@180.75.0.5:5432/agentic_noc
          KAFKA_BOOTSTRAP_SERVERS: 180.75.0.31:9092
          KAFKA_TOPIC_RAW_ALARMS: noc.alarm.raw.v1
          KAFKA_TOPIC_NORMALIZED_ALARMS: noc.alarm.normalized.v1
          KAFKA_TOPIC_CANDIDATE_INCIDENTS: noc.incident.candidate.v1
          KAFKA_TOPIC_ALARM_DLQ: noc.alarm.dlq.v1
          KAFKA_TOPIC_V2_EVENTS: noc.alarm.events.v2
          NIFI_BASE_URL: http://180.75.0.10:8883
          NIFI_GROUP_NAME: noc-alarm-http-to-agenticnoc-v1
          AGENTICNOC_INGEST_URL: http://180.75.0.7:8000/api/ingestion/v2/alarms/
          PROMETHEUS_BASE_URL: http://180.75.0.13:9090
          PROMETHEUS_METRIC_QUERY: agenticnoc_alarm_active
          CLICKHOUSE_HOST: 180.75.0.9
          CLICKHOUSE_PORT: '8123'
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ''
          CLICKHOUSE_DATABASE: agentic_noc
          CLICKHOUSE_CONFIG_TABLE: agentic_noc_config
          CLICKHOUSE_PERFORMANCE_TABLE: agentic_noc_performance
          AGENTICNOC_ROLE: all
          AGENTICNOC_METRICS_BIND: 0.0.0.0
          AGENTICNOC_METRICS_PORT: '8000'
        Volumes:
        - /{{ service_volume }}/iktara/Repository/{{ service }}/{{ version }}/deployment.env:/iktara/Repository/{{
          service }}/{{ version }}/deployment.env:ro
        - /{{ service_volume }}/iktara/agenticnoc/logs:/app/logs
        - /{{ service_volume }}/iktara/agenticnoc/runtime:/tmp/agenticnoc
        Observability:
          container_history:
            enabled: true
          file_logs:
            enabled: true
            paths:
            - /{{ service_volume }}/iktara/agenticnoc/logs
            loki_labels:
              service_name: AgenticNOC
              service_type: AgenticNOC
              source_type: file
          service_events:
            enabled: true
          live_logs:
            enabled: true
